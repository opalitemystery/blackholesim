<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hole Geodesics Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; height: 100vh; }
        body.light-mode { background: #ffffff; color: #1a1a1a; }
        
        .main-container { flex: 1; display: flex; flex-direction: column; }
        
        .canvas-wrapper { position: relative; flex: 1; }
        #spacetimeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: transparent;
            display: none;
        }

        body.spacetime-enabled #spacetimeCanvas { display: block; }
        
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; background: #1a1a1a; cursor: grab; z-index: 2; }
        body.light-mode #canvas { background: #ffffff; }
        #canvas:active { cursor: grabbing; }
        
        body.spacetime-enabled #canvas { 
            background: transparent;
            z-index: 3;
        }
        
        .visualization-label { position: absolute; bottom: 12px; right: 12px; font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; z-index: 20; pointer-events: none; }
        body.light-mode .visualization-label { color: #999; }
        
        .sidebar { width: 420px; padding: 30px; background: #0f0f0f; border-left: 1px solid #333; overflow-y: auto; max-height: 100vh; }
        body.light-mode .sidebar { background: #f8f8f8; border-left: 1px solid #ddd; }
        .header { margin-bottom: 30px; }
        .site-title { font-size: 14px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        body.light-mode .site-title { color: #666; }
        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; font-weight: 700; color: #ffffff; }
        body.light-mode h1 { color: #1a1a1a; }
        .top-controls { display: flex; gap: 12px; }
        .icon-btn { width: 40px; height: 40px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; }
        body.light-mode .icon-btn { background: #f0f0f0; border-color: #ddd; }
        .icon-btn:hover { background: #333; transform: scale(1.05); }
        body.light-mode .icon-btn:hover { background: #e0e0e0; }
        .icon-btn.active { background: #444; border-color: #666; }
        body.light-mode .icon-btn.active { background: #d0d0d0; border-color: #999; }
        .divider { height: 1px; background: #333; margin: 24px 0; }
        body.light-mode .divider { background: #ddd; }
        .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .param-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; }
        body.light-mode label { color: #888; }
        input[type="text"], input[type="range"] { font-family: 'Inter', sans-serif; }
        input[type="text"] { background: #2a2a2a; border: 1px solid #444; color: #ffffff; padding: 8px 10px; border-radius: 6px; font-size: 12px; width: 100%; }
        body.light-mode input[type="text"] { background: #f5f5f5; border-color: #ddd; color: #1a1a1a; }
        input[type="text"]:focus { outline: none; border-color: #666; background: #333; }
        body.light-mode input[type="text"]:focus { background: #fff; border-color: #999; }
        button { width: 100%; padding: 12px; background: #333; color: #ffffff; border: 1px solid #555; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; transition: all 0.2s ease; }
        body.light-mode button { background: #e8e8e8; color: #1a1a1a; border-color: #ddd; }
        button:hover:not(:disabled) { background: #404040; border-color: #666; transform: translateY(-1px); }
        body.light-mode button:hover:not(:disabled) { background: #d8d8d8; border-color: #999; }
        button:disabled { background: #222; cursor: not-allowed; opacity: 0.5; }
        .control-section { margin-bottom: 18px; padding: 14px; background: #1f1f1f; border-radius: 8px; }
        body.light-mode .control-section { background: #f5f5f5; }
        .section-label { font-size: 11px; color: #666; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; display: block; }
        body.light-mode .section-label { color: #888; }
        input[type="range"] { width: 100%; cursor: pointer; height: 4px; accent-color: #666; background: #333; border-radius: 2px; }
        body.light-mode input[type="range"] { background: #ddd; accent-color: #999; }
        .info { padding: 14px; background: #1f1f1f; border-left: 3px solid #666; font-size: 12px; color: #aaa; border-radius: 6px; margin-top: 18px; }
        body.light-mode .info { background: #f5f5f5; color: #666; border-left-color: #999; }
        .toggle-value { font-size: 10px; color: #666; display: block; margin-top: 6px; }
        body.light-mode .toggle-value { color: #888; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #0f0f0f; border: 1px solid #333; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        body.light-mode .modal-content { background: #f8f8f8; border-color: #ddd; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: #fff; }
        body.light-mode .modal-title { color: #1a1a1a; }
        .preset-item { padding: 16px; background: #1f1f1f; border: 1px solid #333; border-radius: 8px; margin-bottom: 12px; }
        body.light-mode .preset-item { background: #f5f5f5; border-color: #ddd; }
        .preset-name { font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #fff; }
        body.light-mode .preset-name { color: #1a1a1a; }
        .preset-desc { font-size: 11px; color: #777; margin-bottom: 12px; }
        body.light-mode .preset-desc { color: #888; }
        .preset-buttons { display: flex; gap: 10px; }
        .preset-buttons button { flex: 1; padding: 8px; font-size: 10px; margin: 0; }
        .modal-close { font-size: 28px; font-weight: bold; cursor: pointer; color: #888; float: right; line-height: 1; }
        .modal-close:hover { color: #fff; }
        body.light-mode .modal-close:hover { color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="canvas-wrapper">
            <canvas id="spacetimeCanvas"></canvas>
            <canvas id="canvas"></canvas>
            <div class="visualization-label" id="visLabel"></div>
        </div>
    </div>
    
    <div class="sidebar">
        <div class="header">
            <div class="site-title">Black Hole Simulator</div>
            <div class="title-row">
                <h1>Black Hole</h1>
                <div class="top-controls">
                    <button class="icon-btn" id="spacetimeBtn" title="Toggle spacetime visualization">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="1"></circle>
                            <circle cx="19" cy="12" r="1"></circle>
                            <circle cx="5" cy="12" r="1"></circle>
                            <circle cx="12" cy="5" r="1"></circle>
                            <circle cx="12" cy="19" r="1"></circle>
                            <circle cx="16.24" cy="7.76" r="1"></circle>
                            <circle cx="7.76" cy="16.24" r="1"></circle>
                            <circle cx="16.24" cy="16.24" r="1"></circle>
                            <circle cx="7.76" cy="7.76" r="1"></circle>
                        </svg>
                    </button>
                    <button class="icon-btn" id="homeBtn" title="Reset view">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                    </button>
                    <button class="icon-btn" id="modeToggle" title="Toggle dark/light mode">
                        <svg id="modeIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="divider"></div>
        <button id="presetsBtn">Load Presets</button>
        <div class="divider"></div>
        <div class="param-grid" id="paramContainer"></div>
        <button id="simulateBtn">Simulate</button>
        <div class="divider"></div>

        <div class="control-section">
            <label class="section-label">Animation Speed</label>
            <input type="range" id="speedSlider" min="1" max="10" value="5">
        </div>

        <div class="control-section">
            <label class="section-label">Trail Length</label>
            <input type="range" id="trailSlider" min="5" max="1000" value="30">
            <span class="toggle-value" id="trailValue">30 points</span>
        </div>

        <div class="info">
            <div>Active Rays: <strong id="trajCount">0</strong></div>
            <div style="margin-top: 8px;" id="statusText"></div>
        </div>
    </div>

    <div id="presetsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2 class="modal-title">Common Simulations</h2>
            <div id="presetsContainer"></div>
        </div>
    </div>

    <script>
        const PRESETS = {
            schwarzschildBasic: {
                title: "Photon falls into photon sphere",
                description: "non rotating black hole, photon starts at r = 10 and falls into photon sphere.",
                values: { M: 1.0, a: 0.0, r0: 10.0, phi0: 0.0, rDot0: -0.32972897961810962501, phiDot0: 0.01935, lambdaMax: 150000, stepInit: 0.0001, outputEvery: 10 }
            },
            rotatingOrbit: {
                title: "Photon orbits a rotating black hole",
                description: "rotating black hole with a = 0.5, photon starts at r = 3.3667 and forms a circular orbit.",
                values: { M: 1.0, a: 0.5, r0: 3.3667943640587, phi0: 0.0, rDot0: 0, phiDot0: 0.5, lambdaMax: 150, stepInit: 0.001, outputEvery: 10 }
            },
            rotatingStill: {
                title: "Photon lies motionless",
                description: "rotating black hole with a = 0.5, photon starts at r = 2.3472963554 and remains stationary.",
                values: { M: 1.0, a: 0.5, r0: 2.3472963554, phi0: 0.0, rDot0: 0, phiDot0: 0, lambdaMax: 150, stepInit: 0.001, outputEvery: 10 }
            }
        };

        const spacetimeCanvas = document.getElementById('spacetimeCanvas');
        const spacetimeCtx = spacetimeCanvas.getContext('2d');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const SCALE_BASE = 30;
        const COLORS = ['#00d4ff', '#39ff14', '#ffff00', '#ffbe0b', '#8338ec', '#fb5607', '#3a86ff', '#06ffa5'];
        
        const parameterDefaults = { M: 1.0, a: 0.0, r0: 5.0, phi0: 0.0, rDot0: 0.0, phiDot0: 0.192, lambdaMax: 100.0, stepInit: 0.01, outputEvery: 10 };
        const parameterOrder = ['M', 'a', 'r0', 'phi0', 'rDot0', 'phiDot0', 'lambdaMax', 'stepInit', 'outputEvery'];
        const parameterLabels = { M: 'Mass', a: 'Spin', r0: 'Start Radius', phi0: 'Start Angle', rDot0: 'Radial Velocity', phiDot0: 'Angular Velocity', lambdaMax: 'Simulation Length', stepInit: 'Step Size', outputEvery: 'Sample Rate' };

        let trajectories = [];
        let isLoading = false;
        let animationProgress = {};
        let animationFrameId = null;
        let animationSpeed = 5;
        let trailLength = 30;
        let animationComplete = false;
        let panX = 0;
        let panY = 0;
        let zoom = 1;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let spacetimeEnabled = false;

        function drawKerrGridVisualization() {
            const isDark = !document.body.classList.contains('light-mode');
            const M = parseFloat(document.getElementById('M')?.value || 1.0);
            const a = parseFloat(document.getElementById('a')?.value || 0.0) * M;
            
            const width = spacetimeCanvas.width;
            const height = spacetimeCanvas.height;
            const SCALE = SCALE_BASE * zoom;
            const centerX = width / 2 + panX;
            const centerY = height / 2 + panY;
            const scale = 50;
            
            spacetimeCtx.fillStyle = isDark ? '#1a1a1a' : '#ffffff';
            spacetimeCtx.clearRect(0, 0, width, height);
            spacetimeCtx.fillRect(0, 0, width, height);
            
            spacetimeCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            const r_plus = M + Math.sqrt(Math.max(0, M*M - a*a));
            spacetimeCtx.beginPath();
            spacetimeCtx.arc(centerX, centerY, r_plus * scale, 0, 2*Math.PI);
            spacetimeCtx.fill();
            
            spacetimeCtx.strokeStyle = 'rgba(255, 50, 50, 0.6)';
            spacetimeCtx.lineWidth = 2;
            spacetimeCtx.beginPath();
            spacetimeCtx.arc(centerX, centerY, r_plus * scale, 0, 2*Math.PI);
            spacetimeCtx.stroke();
            
            const gridLines = 6;
            for (let i = 1; i <= gridLines; i++) {
                const r_grid = r_plus + (i * (8 - r_plus)) / gridLines;
                const warp = 1 - Math.exp(-0.5 * (r_grid - r_plus) / (8 - r_plus));
                const twistAmount = a / (r_grid * r_grid + a*a);
                
                spacetimeCtx.strokeStyle = `rgba(100, 100, 100, ${0.3 + 0.2 * (1 - warp)})`;
                spacetimeCtx.lineWidth = 0.5;
                
                for (let theta = 0; theta < 2*Math.PI; theta += Math.PI / 16) {
                    const twistAngle = theta + twistAmount * (Math.PI/2) * Math.sin(2*theta) * 3;
                    
                    const x = centerX + r_grid * scale * Math.cos(twistAngle);
                    const y = centerY + r_grid * scale * Math.sin(twistAngle);
                    
                    if (theta === 0) {
                        spacetimeCtx.beginPath();
                        spacetimeCtx.moveTo(x, y);
                    } else {
                        spacetimeCtx.lineTo(x, y);
                    }
                }
                spacetimeCtx.closePath();
                spacetimeCtx.stroke();
            }
            
            for (let theta = 0; theta < 2*Math.PI; theta += Math.PI / 8) {
                spacetimeCtx.strokeStyle = 'rgba(100, 100, 100, 0.2)';
                spacetimeCtx.lineWidth = 0.5;
                spacetimeCtx.beginPath();
                
                for (let r_val = r_plus * 1.1; r_val <= 8; r_val += 0.3) {
                    const twistAmount = a / (r_val * r_val + a*a);
                    const twistAngle = theta + twistAmount * (Math.PI/2) * Math.sin(2*theta) * 3;
                    
                    const x = centerX + r_val * scale * Math.cos(twistAngle);
                    const y = centerY + r_val * scale * Math.sin(twistAngle);
                    
                    if (r_val === r_plus * 1.1) {
                        spacetimeCtx.moveTo(x, y);
                    } else {
                        spacetimeCtx.lineTo(x, y);
                    }
                }
                spacetimeCtx.stroke();
            }
        }

        function drawSpacetimeGrid() {
            if (!spacetimeEnabled) return;
            drawKerrGridVisualization();
        }

        function initializeParameters() {
            const container = document.getElementById('paramContainer');
            if (!container) { console.error('paramContainer not found!'); return; }
            container.innerHTML = '';
            
            parameterOrder.forEach(key => {
                const div = document.createElement('div');
                div.className = 'param-group';
                div.innerHTML = `<label>${parameterLabels[key]}</label><input type="text" id="${key}" value="${parameterDefaults[key]}">`;
                container.appendChild(div);
            });
        }

        function initializePresets() {
            const container = document.getElementById('presetsContainer');
            if (!container) return;
            container.innerHTML = '';
            
            Object.entries(PRESETS).forEach(([key, preset]) => {
                const div = document.createElement('div');
                div.className = 'preset-item';
                div.innerHTML = `
                    <div class="preset-name">${preset.title}</div>
                    <div class="preset-desc">${preset.description}</div>
                    <div class="preset-buttons">
                        <button onclick="window.loadPreset('${key}')">Load</button>
                        <button onclick="window.copyPreset('${key}')">Copy</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.loadPreset = function(presetKey) {
            const preset = PRESETS[presetKey];
            Object.entries(preset.values).forEach(([key, value]) => {
                const input = document.getElementById(key);
                if (input) input.value = value;
            });
            document.getElementById('presetsModal').classList.remove('show');
            if (spacetimeEnabled) drawSpacetimeGrid();
            draw();
        };

        window.copyPreset = function(presetKey) {
            const preset = PRESETS[presetKey];
            const text = Object.entries(preset.values).map(([k, v]) => `${k}: ${v}`).join('\n');
            navigator.clipboard.writeText(text);
            alert('Copied!');
        };

        function resizeCanvas() {
            spacetimeCanvas.width = window.innerWidth - 420;
            spacetimeCanvas.height = window.innerHeight;
            
            canvas.width = window.innerWidth - 420;
            canvas.height = window.innerHeight;
            
            if (spacetimeEnabled) drawSpacetimeGrid();
            draw();
        }

        function getParams() {
            return {
                M: parseFloat(document.getElementById('M').value),
                a: parseFloat(document.getElementById('a').value),
                r0: parseFloat(document.getElementById('r0').value),
                phi0: parseFloat(document.getElementById('phi0').value),
                rDot0: parseFloat(document.getElementById('rDot0').value),
                phiDot0: parseFloat(document.getElementById('phiDot0').value),
                lambdaMax: parseFloat(document.getElementById('lambdaMax').value),
                stepInit: parseFloat(document.getElementById('stepInit').value),
                outputEvery: parseInt(document.getElementById('outputEvery').value)
            };
        }

        function draw() {
            const centerX = canvas.width / 2 + panX;
            const centerY = canvas.height / 2 + panY;
            const SCALE = SCALE_BASE * zoom;
            const isDark = !document.body.classList.contains('light-mode');

            // Only fill with background if spacetime is NOT enabled
            if (!spacetimeEnabled) {
                ctx.fillStyle = isDark ? '#1a1a1a' : '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // Draw black hole
            const M = parseFloat(document.getElementById('M')?.value || 1);
            const bhRadius = Math.max(5, 2 * M * SCALE);
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(centerX, centerY, bhRadius, 0, Math.PI * 2);
            ctx.fill();

            // Draw trajectories
            trajectories.forEach((traj, idx) => {
                if (!traj.trajectory || traj.trajectory.length === 0) return;
                ctx.strokeStyle = COLORS[idx % COLORS.length];
                ctx.lineWidth = 2;
                ctx.beginPath();
                traj.trajectory.forEach((point, i) => {
                    const x = centerX + point.x * SCALE;
                    const y = centerY + point.y * SCALE;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            });
        }

        function animate() {
            let allDone = true;
            trajectories.forEach((traj, idx) => {
                if (!traj.trajectory) return;
                if (animationProgress[idx] === undefined) animationProgress[idx] = 0;
                animationProgress[idx] += (animationSpeed / 100) * 0.016;
                if (animationProgress[idx] < 1) allDone = false;
                animationProgress[idx] = Math.min(animationProgress[idx], 1);
            });
            drawAnimated();
            if (!allDone) {
                animationFrameId = requestAnimationFrame(animate);
            } else {
                animationFrameId = null;
                animationComplete = true;
                draw();
            }
        }

        function drawAnimated() {
            const isDark = !document.body.classList.contains('light-mode');
            const centerX = canvas.width / 2 + panX;
            const centerY = canvas.height / 2 + panY;
            const SCALE = SCALE_BASE * zoom;

            ctx.fillStyle = isDark ? '#1a1a1a' : '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const MInput = document.getElementById('M');
            const M = MInput ? parseFloat(MInput.value) : 1.0;
            const bhRadius = Math.max(5, 2 * M * SCALE);
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(centerX, centerY, bhRadius, 0, Math.PI * 2);
            ctx.fill();

            trajectories.forEach((traj, idx) => {
                if (!traj.trajectory || traj.trajectory.length === 0) return;

                const pointsToDraw = Math.floor(traj.trajectory.length * animationProgress[idx]);
                if (pointsToDraw === 0) return;

                const rainbowColors = [
                    {r: 255, g: 0, b: 0},
                    {r: 255, g: 127, b: 0},
                    {r: 255, g: 255, b: 0},
                    {r: 0, g: 255, b: 0},
                    {r: 0, g: 0, b: 255},
                    {r: 75, g: 0, b: 130},
                    {r: 148, g: 0, b: 211}
                ];

                ctx.strokeStyle = COLORS[idx % COLORS.length];
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                for (let i = 0; i < pointsToDraw; i++) {
                    const point = traj.trajectory[i];
                    const x = centerX + point.x * SCALE;
                    const y = centerY + point.y * SCALE;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                const lastIdx = pointsToDraw - 1;
                for (let fade = 0; fade <= trailLength && lastIdx - fade >= 0; fade++) {
                    const prevIdx = lastIdx - fade;
                    const prevPoint = traj.trajectory[prevIdx];
                    const px = centerX + prevPoint.x * SCALE;
                    const py = centerY + prevPoint.y * SCALE;

                    const opacity = Math.max(0, 1 - fade / trailLength) * 0.8;
                    const rainbowIndex = Math.floor((fade / trailLength) * (rainbowColors.length - 1));
                    const color = rainbowColors[rainbowIndex];
                    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${opacity})`;
                    ctx.beginPath();
                    ctx.arc(px, py, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        async function simulate() {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('simulateBtn').disabled = true;

            try {
                const params = getParams();
                const response = await fetch('http://localhost:5000/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });

                const data = await response.json();
                if (data.success) {
                    trajectories = [data];
                    document.getElementById('trajCount').textContent = '1';
                    document.getElementById('statusText').textContent = 'Status: ' + data.status;
                    animationProgress = {};
                    animationComplete = false;
                    animate();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                isLoading = false;
                document.getElementById('simulateBtn').disabled = false;
            }
        }

        function updateVisLabel() {
            const label = document.getElementById('visLabel');
            label.textContent = spacetimeEnabled ? 'Spacetime + Geodesics' : 'Geodesics';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const oldZoom = zoom;
            zoom += e.deltaY > 0 ? -0.03 : 0.03;
            zoom = Math.max(0.1, Math.min(zoom, 10));
            const zoomFactor = zoom / oldZoom;
            panX = x - (x - panX) * zoomFactor;
            panY = y - (y - panY) * zoomFactor;
            if (spacetimeEnabled) drawSpacetimeGrid();
            draw();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStart = { x: e.clientX, y: e.clientY }; });
        canvas.addEventListener('mousemove', (e) => { 
            if (isDragging) { 
                panX += e.clientX - dragStart.x; 
                panY += e.clientY - dragStart.y; 
                dragStart = { x: e.clientX, y: e.clientY }; 
                if (spacetimeEnabled) drawSpacetimeGrid();
                draw();
            } 
        });
        canvas.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        document.getElementById('spacetimeBtn').addEventListener('click', function(e) {
            spacetimeEnabled = !spacetimeEnabled;
            document.body.classList.toggle('spacetime-enabled', spacetimeEnabled);
            this.classList.toggle('active', spacetimeEnabled);
            updateVisLabel();

            if (spacetimeEnabled) drawSpacetimeGrid();
            draw();
        });

        document.getElementById('homeBtn').addEventListener('click', () => { 
            panX = 0; 
            panY = 0; 
            zoom = 1; 
            if (spacetimeEnabled) drawSpacetimeGrid();
            draw(); 
        });

        document.getElementById('modeToggle').addEventListener('click', () => { 
            document.body.classList.toggle('light-mode'); 
            localStorage.setItem('darkMode', !document.body.classList.contains('light-mode')); 
            if (spacetimeEnabled) drawSpacetimeGrid();
            draw(); 
        });

        document.getElementById('presetsBtn').addEventListener('click', () => { 
            document.getElementById('presetsModal').classList.add('show'); 
        });

        document.getElementById('presetsModal').addEventListener('click', (e) => { 
            if (e.target.id === 'presetsModal') document.getElementById('presetsModal').classList.remove('show'); 
        });

        document.querySelector('.modal-close').addEventListener('click', () => { 
            document.getElementById('presetsModal').classList.remove('show'); 
        });

        document.getElementById('simulateBtn').addEventListener('click', simulate);
        document.getElementById('speedSlider').addEventListener('change', (e) => { 
            animationSpeed = parseInt(e.target.value); 
        });

        document.getElementById('trailSlider').addEventListener('input', (e) => { 
            trailLength = parseInt(e.target.value); 
            document.getElementById('trailValue').textContent = trailLength + ' points'; 
            if (trajectories.length > 0) draw(); 
        });

        if (localStorage.getItem('darkMode') === 'false') document.body.classList.add('light-mode');

        initializeParameters();
        initializePresets();
        updateVisLabel();
        draw();

        const MInput = document.getElementById('M');
        const aInput = document.getElementById('a');
        if (MInput) {
            MInput.addEventListener('input', () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (spacetimeEnabled) drawSpacetimeGrid();
                draw();
            });
        }
        if (aInput) {
            aInput.addEventListener('input', () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                if (spacetimeEnabled) drawSpacetimeGrid();
            });
        }
    </script>
</body>
</html>
